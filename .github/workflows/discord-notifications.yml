name: Discord Notifications Actions
jobs:
  issue-notification:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    name: Issue Notification
    steps:
    - name: Set issue status
      id: issue
      run: |
        case "${{ github.event.action }}" in
          opened)
            echo "emoji=🆕" >> $GITHUB_OUTPUT
            echo "action=opened" >> $GITHUB_OUTPUT
            ;;
          closed)
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "action=closed" >> $GITHUB_OUTPUT
            ;;
          reopened)
            echo "emoji=🔄" >> $GITHUB_OUTPUT
            echo "action=reopened" >> $GITHUB_OUTPUT
            ;;
        esac
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG issue-notification: observing source -> args -> sink data flow"
        ISSUE_TITLE=${{ toJSON(github.event.issue.title) }}
        ISSUE_LOGIN=${{ toJSON(github.event.issue.user.login) }}
        ISSUE_NUMBER=${{ toJSON(github.event.issue.number) }}
        ISSUE_ACTION=${{ toJSON(github.event.action) }}
        EMOJI=${{ toJSON(steps.issue.outputs.emoji) }}
        ACTION_OUT=${{ toJSON(steps.issue.outputs.action) }}
        ARGS_BUILT=${{ toJSON(format('{0} **Issue {1}** - #{2}: {3} by {4} - [View Issue]({5})', steps.issue.outputs.emoji, steps.issue.outputs.action, github.event.issue.number, github.event.issue.title, github.event.issue.user.login, github.event.issue.html_url)) }}
        printf 'GERALT_DBG issue.title=%s\n' "$ISSUE_TITLE"
        printf 'GERALT_DBG issue.user.login=%s\n' "$ISSUE_LOGIN"
        printf 'GERALT_DBG issue.number=%s\n' "$ISSUE_NUMBER"
        printf 'GERALT_DBG action=%s\n' "$ISSUE_ACTION"
        printf 'GERALT_DBG emoji=%s\n' "$EMOJI"
        printf 'GERALT_DBG status_action=%s\n' "$ACTION_OUT"
        printf 'GERALT_DBG args-to-action=%s\n' "$ARGS_BUILT"
        if printf '%s' "$ARGS_BUILT" | grep -q '{{'; then
          echo "GERALT_DBG PAYLOAD: lodash interpolation metacharacters '{{ }}' present in args -> will reach _.template sink"
        else
          echo "GERALT_DBG PAYLOAD: no '{{ }}' metacharacters observed in args"
        fi
        if printf '%s' "$ARGS_BUILT" | grep -q '<%'; then
          echo "GERALT_DBG PAYLOAD: lodash evaluate delimiter '<% %>' present in args -> will reach _.template sink"
        else
          echo "GERALT_DBG PAYLOAD: no '<% %>' delimiter observed in args"
        fi
        echo "GERALT_DBG next step (sink): Ilshidur/action-discord@0.3.2 joins argv._ and calls _.template(argv._.join(' ')) with new Function()"
      continue-on-error: true
    - name: Send Discord notification
      uses: Ilshidur/action-discord@0.3.2
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: '${{ steps.issue.outputs.emoji }} **Issue ${{ steps.issue.outputs.action }}** - #${{ github.event.issue.number }}: ${{ github.event.issue.title }} by ${{ github.event.issue.user.login }} - [View Issue](${{ github.event.issue.html_url }})'
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  issues:
    types:
    - opened
    - closed
    - reopened
  release:
    types:
    - published
  pull_request:
    types:
    - opened
    - closed
